name: CI

# Every branch push is checked; pull requests from this repository show the
# result on their head commit.
on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax checks and test suite
        run: npm test
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
